<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5c3d48"><title>لا يوجد اتصال | النرجس للتطريز</title><link rel="icon" href="./lo.png"><style>
:root{color-scheme:dark;--teal:#3db7b5;--rose:#e8c1d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top right,#203538,#101518 60%);font-family:Cairo,"Segoe UI",Arial,sans-serif;color:#f3eaf0}.card{width:min(100%,560px);padding:clamp(24px,5vw,44px);border:1px solid #315658;border-radius:28px;background:rgba(24,34,38,.92);box-shadow:0 24px 80px #0005;text-align:center}.logo{width:84px;height:84px;object-fit:contain;margin-bottom:12px}h1{margin:0 0 12px;font-size:clamp(25px,5vw,36px);color:var(--rose)}p{line-height:2;color:#c9d1d3}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px}a,button{min-height:48px;padding:12px 20px;border-radius:14px;font:700 15px Cairo,"Segoe UI",Arial,sans-serif;cursor:pointer;text-decoration:none;border:1px solid var(--teal)}a{background:linear-gradient(100deg,#5c3d48,#258f8d);color:#fff}button{background:transparent;color:#f3eaf0}a:focus-visible,button:focus-visible{outline:3px solid #80f1ea;outline-offset:3px}</style></head><body><main class="card"><img class="logo" src="./lo.webp" alt="شعار النرجس للتطريز"><h1>انقطع الاتصال مؤقتًا</h1><p>يمكنك فتح الصفحات التي زرتها سابقًا إذا كانت محفوظة على هذا الجهاز. يحتاج إرسال الطلب أو فتح واتساب إلى اتصال بالإنترنت.</p><div class="actions"><a href="./index.html">العودة إلى الموقع</a><button type="button" onclick="location.reload()">إعادة المحاولة</button></div></main></body></html>
