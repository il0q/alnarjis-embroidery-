<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- السطر المسؤول عن تغيير أيقونة المتصفح لشعار النرجس -->
    <link rel="icon" type="image/png" href="lo.png">
    <title>تم إرسال طلبك بنجاح | النرجس للتطريز</title>
    
    <!-- استدعاء خط Cairo ليتناسب مع الهوية البصرية الجديدة للموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* الألوان والهوية البصرية الدافئة والمريحة للعين المتطابقة مع الهوية الجديدة */
        :root {
            --primary-color: #5c3d48; /* العنابي الملكي للمطرزات */
            --accent-color: #3DB7B5;  /* الذهبي الدافئ المريح */
            --bg-color: #FAF9F6;      /* درجة كريمية دافئة جداً وناعمة للعين */
            --card-bg: #f0eae1;       /* درجة دافئة للبطاقات بدلاً من الأبيض الصريح */
            --text-dark: #2d2d2d;     /* رمادي داكن ناعم للنصوص */
            --text-muted: #554d4f;    /* لون مريح للقراءة */
            --shadow: 0 15px 35px rgba(92, 61, 72, 0.06);
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        body {
            overflow-x: clip;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FAF9F6 0%, #B7EBE3 100%);
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 🧵 تأثير الخيوط الحية ثلاثية الأبعاد العائمة في الخلفية */
        .bg-threads-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transform-style: preserve-3d;
        }

        .thread-3d {
            position: absolute;
            width: 100%;
            max-width: 100%;
            height: 300px;
            fill: none;
            stroke-linecap: round;
        }

        .t-gold {
            top: 10%;
            left: 0;
            stroke: rgba(61, 183, 181, 0.24); 
            stroke-width: 2.5;
            animation: weave3D-Gold 25s infinite ease-in-out alternate;
        }

        .t-burgundy {
            bottom: 10%;
            right: 0;
            stroke: rgba(92, 61, 72, 0.22); 
            stroke-width: 2;
            animation: weave3D-Burgundy 30s infinite ease-in-out alternate;
        }

        /* بطاقة الشكر الفاخرة */
        .thank-you-card {
            background-color: var(--card-bg);
            padding: 50px 40px;
            border-radius: 35px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(184, 148, 36, 0.1);
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .thank-you-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(92, 61, 72, 0.1);
        }

        /* تنسيق شعار النرجس الدائري الحركي */
        .logo-img-thank {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--accent-color);
            transition: transform 0.8s var(--transition);
            box-shadow: 0 8px 20px rgba(92, 61, 72, 0.1);
        }

        .thank-you-card:hover .logo-img-thank {
            transform: rotate(360deg) scale(1.1);
        }

        h1 {
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 900;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* ⚡ فاصل ألوان متحرك وحي تحت العنوان */
        .divider {
            width: 120px;
            height: 4px;
            margin: 15px auto 25px auto;
            border-radius: 10px;
            background: linear-gradient(270deg, var(--primary-color), var(--accent-color), #3DB7B5, var(--primary-color));
            background-size: 600% 600%;
            animation: animateGradientStream 6s infinite linear;
        }

        p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.8;
        }

        /* ✨ زر العودة المطور بتأثير اللمعان والتوهج الذهبي المتطابق مع الموقع */
        .btn-back {
            background: linear-gradient(135deg, var(--accent-color) 0%, #2F8F8B 100%);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.4s var(--transition), box-shadow 0.4s var(--transition);
            display: inline-block;
            box-shadow: 0 10px 25px rgba(184, 148, 36, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* طبقة اللمعان المخفية للزر */
        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: none;
        }

        .btn-back:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 25px rgba(184, 148, 36, 0.8), 0 0 50px rgba(184, 148, 36, 0.4);
        }

        /* تفعيل تأثير وميض اللمعان عند التمرير */
        .btn-back:hover::before {
            animation: shineEffect 1.2s infinite ease-in-out;
        }

        /* 🎬 قوانين الحركات والتموجات واللمعان */
        @keyframes shineEffect {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes animateGradientStream {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes weave3D-Gold {
            0% { transform: translate3d(0, 0, -100px) rotateX(10deg) rotateY(5deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(20px, 30px, 50px) rotateX(-5deg) rotateY(15deg); }
            100% { transform: translate3d(-10px, -20px, -50px) rotateX(5deg) rotateY(-10deg); stroke-dashoffset: -300; }
        }

        @keyframes weave3D-Burgundy {
            0% { transform: translate3d(0, 0, -50px) rotateX(-10deg) rotateY(-10deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(-20px, -40px, 80px) rotateX(15deg) rotateY(5deg); }
            100% { transform: translate3d(15px, 20px, -120px) rotateX(-5deg) rotateY(10deg); stroke-dashoffset: 300; }
        }

        /* التوافق مع الهواتف الذكية */
        @media (max-width: 768px) {
            .thank-you-card {
                padding: 40px 25px;
                margin: 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
            }
            .bg-threads-3d {
                opacity: 0.2;
            }
        }
    </style>

<style id="thread-motion">
.thread-motion{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.38;}
.thread-motion span{position:absolute;width:42vw;height:2px;background:linear-gradient(90deg,transparent,rgba(61,183,181,.28),transparent);border-radius:999px;transform-origin:center;animation:threadDrift 14s ease-in-out infinite;}
.thread-motion span:nth-child(1){top:22%;left:-12%;transform:rotate(18deg);animation-delay:-2s;}
.thread-motion span:nth-child(2){top:48%;left:45%;width:35vw;transform:rotate(-24deg);animation-delay:-7s;}
.thread-motion span:nth-child(3){top:72%;left:-8%;width:48vw;transform:rotate(12deg);animation-delay:-10s;}
.thread-motion span:nth-child(4){top:34%;left:68%;width:30vw;transform:rotate(32deg);animation-delay:-5s;}
@keyframes threadDrift{0%,100%{translate:0 0;scale:1;opacity:.55;}50%{translate:18px -10px;scale:1.04;opacity:1;}}
@media (prefers-reduced-motion:reduce){.thread-motion span{animation:none;}}
@media (max-width:600px){.thread-motion{opacity:.22}.thread-motion span{width:70vw}.thread-motion span:nth-child(2){left:35%;width:55vw}.thread-motion span:nth-child(4){left:55%;width:45vw;}}
</style>



<style id="alnarjis-plexus-style">
#alnarjis-plexus-canvas{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  pointer-events:none!important;
  z-index:0!important;
  opacity:1!important;
}
</style>

</head>
<body>
<canvas id="alnarjis-plexus-canvas" aria-hidden="true"></canvas>

    <!-- 🧵 الخلفية الحية الممتدة ثلاثية الأبعاد -->
    <div class="thread-motion" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="bg-threads-3d">
        <svg class="thread-3d t-gold" viewBox="0 0 1440 400">
            <path d="M0,200 C300,350 600,50 900,200 C1200,350 1300,100 1440,200" />
        </svg>
        <svg class="thread-3d t-burgundy" viewBox="0 0 1440 400">
            <path d="M1440,150 C1100,-50 800,350 500,150 C200,-50 100,250 0,150" />
        </svg>
    </div>

    <div class="thank-you-card">
        <!-- شعار النرجس الدائري المحدث -->
        <img src="lo.png" alt="شعار النرجس" class="logo-img-thank">
        
        <h1>تم إرسال طلبك بنجاح!</h1>
        <!-- الفاصل الملون الحي والمتحرك -->
        <div class="divider"></div>
        
        <p>شكراً لثقتك بالنرجس للتطريز، سيقوم فريقنا بمراجعة تفاصيل طلبك والتواصل معك عبر الواتساب في أقرب وقت ممكن. 🇴🇲</p>
        <a href="index.html" class="btn-back">العودة للرئيسية</a>
    </div>



<script id="alnarjis-plexus-script">
(function(){
  const c=document.getElementById('alnarjis-plexus-canvas');
  if(!c) return;
  const ctx=c.getContext('2d');
  let W=0,H=0,DPR=1,pts=[],tx=-9999,ty=-9999,mx=-9999,my=-9999,active=false;

  const GOLD=[218,170,62], TEAL=[61,183,181], WHITE=[255,255,255];
  const rgba=(a,n)=>`rgba(${a[0]},${a[1]},${a[2]},${n})`;

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    c.width=W*DPR; c.height=H*DPR;
    c.style.width=W+'px'; c.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    // نقاط موزعة في كامل الشاشة، وليس فقط في الأعلى
    const count=Math.max(22,Math.min(65,Math.floor(W*H/17000)));
    pts=Array.from({length:count},(_,i)=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*0.28,
      vy:(Math.random()-.5)*0.28,
      r:.8+Math.random()*1.5,
      col:i%5===0?GOLD:TEAL,
      seed:Math.random()*Math.PI*2
    }));
  }

  addEventListener('resize',resize,{passive:true});
  addEventListener('pointermove',e=>{
    tx=e.clientX; ty=e.clientY; active=true;
  },{passive:true});
  addEventListener('pointerleave',()=>active=false,{passive:true});
  addEventListener('touchmove',e=>{
    if(e.touches[0]){
      tx=e.touches[0].clientX;
      ty=e.touches[0].clientY;
      active=true;
    }
  },{passive:true});
  addEventListener('touchend',()=>active=false,{passive:true});

  resize();

  function frame(t){
    ctx.clearRect(0,0,W,H);

    // حركة ناعمة للمؤشر
    mx += (tx-mx)*.16;
    my += (ty-my)*.16;

    const repelRange=W<700?105:145;
    const connectRange=W<700?0:135;

    for(const p of pts){
      // حركة مستقلة مستمرة في كل مكان
      p.x+=p.vx;
      p.y+=p.vy;

      // التفاف عند أطراف الشاشة
      if(p.x<-10)p.x=W+10;
      if(p.x>W+10)p.x=-10;
      if(p.y<-10)p.y=H+10;
      if(p.y>H+10)p.y=-10;

      // الماوس يبعد النقاط، وليس يجذبها
      if(active){
        const dx=p.x-mx, dy=p.y-my;
        const d=Math.hypot(dx,dy);
        if(d<repelRange && d>0.5){
          const force=(1-d/repelRange)*1.8;
          p.x += dx/d*force;
          p.y += dy/d*force;
          p.vx += dx/d*.012;
          p.vy += dy/d*.012;
        }
      }

      // تخفيف السرعة حتى تبقى الحركة هادئة
      p.vx*=.995; p.vy*=.995;
      if(Math.abs(p.vx)<.05)p.vx += (Math.random()-.5)*.006;
      if(Math.abs(p.vy)<.05)p.vy += (Math.random()-.5)*.006;
    }

    // روابط خفيفة بين النقاط القريبة
    if(connectRange){
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const a=pts[i],b=pts[j];
          const d=Math.hypot(a.x-b.x,a.y-b.y);
          if(d<connectRange){
            const alpha=(1-d/connectRange)*.16;
            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.strokeStyle=rgba((a.col===GOLD||b.col===GOLD)?GOLD:TEAL,alpha);
            ctx.lineWidth=.55;
            ctx.stroke();
          }
        }
      }
    }

    // النقاط المنتشرة
    for(const p of pts){
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=rgba(p.col,.78);
      ctx.fill();

      // توهج صغير وهادئ
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*3.5,0,Math.PI*2);
      ctx.fillStyle=rgba(p.col,.035);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
