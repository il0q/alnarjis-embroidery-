<html lang="ar" dir="rtl">
<head>

    <meta name="theme-color" content="#5c3d48">
    <!-- السطر المسؤول عن تغيير أيقونة المتصفح لشعار النرجس -->
    <link rel="icon" type="image/png" href="lo.png">
    <title>تم إرسال طلبك بنجاح | النرجس للتطريز</title>
    
    <!-- استدعاء خط Cairo ليتناسب مع الهوية البصرية الجديدة للموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* الألوان والهوية البصرية الدافئة والمريحة للعين المتطابقة مع الهوية الجديدة */
        :root {
            --primary-color: #5c3d48; /* العنابي الملكي للمطرزات */
            --accent-color: #3DB7B5;  /* الذهبي الدافئ المريح */
            --bg-color: #FAF9F6;      /* درجة كريمية دافئة جداً وناعمة للعين */
            --card-bg: #f0eae1;       /* درجة دافئة للبطاقات بدلاً من الأبيض الصريح */
            --text-dark: #2d2d2d;     /* رمادي داكن ناعم للنصوص */
            --text-muted: #554d4f;    /* لون مريح للقراءة */
            --shadow: 0 15px 35px rgba(92, 61, 72, 0.06);
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        body {
            overflow-x: clip;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FAF9F6 0%, #B7EBE3 100%);
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 🧵 تأثير الخيوط الحية ثلاثية الأبعاد العائمة في الخلفية */
        .bg-threads-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transform-style: preserve-3d;
        }

        .thread-3d {
            position: absolute;
            width: 100%;
            max-width: 100%;
            height: 300px;
            fill: none;
            stroke-linecap: round;
        }

        .t-gold {
            top: 10%;
            left: 0;
            stroke: rgba(61, 183, 181, 0.24); 
            stroke-width: 2.5;
            animation: weave3D-Gold 25s infinite ease-in-out alternate;
        }

        .t-burgundy {
            bottom: 10%;
            right: 0;
            stroke: rgba(92, 61, 72, 0.22); 
            stroke-width: 2;
            animation: weave3D-Burgundy 30s infinite ease-in-out alternate;
        }

        /* بطاقة الشكر الفاخرة */
        .thank-you-card {
            background-color: var(--card-bg);
            padding: 50px 40px;
            border-radius: 35px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(184, 148, 36, 0.1);
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .thank-you-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(92, 61, 72, 0.1);
        }

        /* تنسيق شعار النرجس الدائري الحركي */
        .logo-img-thank {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--accent-color);
            transition: transform 0.8s var(--transition);
            box-shadow: 0 8px 20px rgba(92, 61, 72, 0.1);
        }

        .thank-you-card:hover .logo-img-thank {
            transform: rotate(360deg) scale(1.1);
        }

        h1 {
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 900;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* ⚡ فاصل ألوان متحرك وحي تحت العنوان */
        .divider {
            width: 120px;
            height: 4px;
            margin: 15px auto 25px auto;
            border-radius: 10px;
            background: linear-gradient(270deg, var(--primary-color), var(--accent-color), #3DB7B5, var(--primary-color));
            background-size: 600% 600%;
            animation: animateGradientStream 6s infinite linear;
        }

        p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.8;
        }

        /* ✨ زر العودة المطور بتأثير اللمعان والتوهج الذهبي المتطابق مع الموقع */
        .btn-back {
            background: linear-gradient(135deg, var(--accent-color) 0%, #2F8F8B 100%);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.4s var(--transition), box-shadow 0.4s var(--transition);
            display: inline-block;
            box-shadow: 0 10px 25px rgba(184, 148, 36, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* طبقة اللمعان المخفية للزر */
        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: none;
        }

        .btn-back:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 25px rgba(184, 148, 36, 0.8), 0 0 50px rgba(184, 148, 36, 0.4);
        }

        /* تفعيل تأثير وميض اللمعان عند التمرير */
        .btn-back:hover::before {
            animation: shineEffect 1.2s infinite ease-in-out;
        }

        /* 🎬 قوانين الحركات والتموجات واللمعان */
        @keyframes shineEffect {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes animateGradientStream {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes weave3D-Gold {
            0% { transform: translate3d(0, 0, -100px) rotateX(10deg) rotateY(5deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(20px, 30px, 50px) rotateX(-5deg) rotateY(15deg); }
            100% { transform: translate3d(-10px, -20px, -50px) rotateX(5deg) rotateY(-10deg); stroke-dashoffset: -300; }
        }

        @keyframes weave3D-Burgundy {
            0% { transform: translate3d(0, 0, -50px) rotateX(-10deg) rotateY(-10deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(-20px, -40px, 80px) rotateX(15deg) rotateY(5deg); }
            100% { transform: translate3d(15px, 20px, -120px) rotateX(-5deg) rotateY(10deg); stroke-dashoffset: 300; }
        }

        /* التوافق مع الهواتف الذكية */
        @media (max-width: 768px) {
            .thank-you-card {
                padding: 40px 25px;
                margin: 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
            }
            .bg-threads-3d {
                opacity: 0.2;
            }
        }
    </style>

<style id="thread-motion">
.thread-motion{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.38;}
.thread-motion span{position:absolute;width:42vw;height:2px;background:linear-gradient(90deg,transparent,rgba(61,183,181,.28),transparent);border-radius:999px;transform-origin:center;animation:threadDrift 14s ease-in-out infinite;}
.thread-motion span:nth-child(1){top:22%;left:-12%;transform:rotate(18deg);animation-delay:-2s;}
.thread-motion span:nth-child(2){top:48%;left:45%;width:35vw;transform:rotate(-24deg);animation-delay:-7s;}
.thread-motion span:nth-child(3){top:72%;left:-8%;width:48vw;transform:rotate(12deg);animation-delay:-10s;}
.thread-motion span:nth-child(4){top:34%;left:68%;width:30vw;transform:rotate(32deg);animation-delay:-5s;}
@keyframes threadDrift{0%,100%{translate:0 0;scale:1;opacity:.55;}50%{translate:18px -10px;scale:1.04;opacity:1;}}
@media (prefers-reduced-motion:reduce){.thread-motion span{animation:none;}}
@media (max-width:600px){.thread-motion{opacity:.22}.thread-motion span{width:70vw}.thread-motion span:nth-child(2){left:35%;width:55vw}.thread-motion span:nth-child(4){left:55%;width:45vw;}}
</style>

<style id="alnarjis-smooth-motion">
/* طبقة حركة موحّدة: انتقالات ناعمة ومتزنة على جميع صفحات الموقع */
:root { --motion-ease: cubic-bezier(.22,.72,.22,1); --motion-fast: 220ms; --motion-medium: 420ms; }
html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a, button, input, select, textarea, .service-card, .detailed-service-card,
.contact-card, .choice, .color-card, .upload, .review-card, .cost-card,
.btn, [class*="btn-"] {
  transition-property: color, background-color, border-color, box-shadow, opacity, transform, filter;
  transition-duration: var(--motion-fast);
  transition-timing-function: var(--motion-ease);
}
a { -webkit-tap-highlight-color: transparent; }
button, .btn, [class*="btn-"] { transform: translateZ(0); }
button:active, .btn:active, [class*="btn-"]:active { transform: translateY(1px) scale(.985); }
:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent-color, var(--teal, #3DB7B5)) 58%, transparent);
  outline-offset: 3px;
}
:where(input, select, textarea) { transition: border-color 220ms var(--motion-ease), box-shadow 220ms var(--motion-ease), background-color 220ms var(--motion-ease); }
:where(input, select, textarea):focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color, var(--teal, #3DB7B5)) 14%, transparent); }
img, video { max-width: 100%; }
@media (hover:hover) and (pointer:fine) {
  .service-card:hover, .detailed-service-card:hover, .contact-card:hover,
  .review-card:hover, .cost-card:hover { transform: translateY(-4px); }
  .choice:hover, .color-card:hover, .upload:hover { transform: translateY(-2px); }
  a:not(.btn):not([class*="btn-"]):hover { color: var(--accent-color, var(--teal, #2f9692)); }
}
/* انتقال خفيف بين الصفحات في المتصفحات الداعمة */
@view-transition { navigation: auto; }
::view-transition-old(root) { animation: narjis-page-out 180ms ease both; }
::view-transition-new(root) { animation: narjis-page-in 360ms var(--motion-ease) both; }
@keyframes narjis-page-out { to { opacity: .94; } }
@keyframes narjis-page-in { from { opacity: .86; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
/* شريط تقدّم رفيع أثناء التمرير */
#narjis-scroll-progress { position: fixed; inset: 0 auto auto 0; width: 0%; height: 3px; z-index: 10000; pointer-events: none; background: linear-gradient(90deg, var(--accent-color, var(--teal, #2f9692)), #75d4cc); box-shadow: 0 1px 6px rgba(47,150,146,.18); transform: translateZ(0); }
/* ظهور العناصر عند دخولها الشاشة؛ لا تُخفى العناصر إلا بعد تفعيل جافاسكربت بنجاح */
.motion-enhanced .motion-reveal { opacity: 0; transform: translate3d(0, 16px, 0); transition: opacity 560ms var(--motion-ease), transform 560ms var(--motion-ease); transition-delay: var(--reveal-delay, 0ms); will-change: opacity, transform; }
.motion-enhanced .motion-reveal.is-visible { opacity: 1; transform: translate3d(0,0,0); }
/* سلاسة الخطوات داخل نموذج الطلب من دون التأثير على إظهار/إخفاء الخطوات */
.order-page .choice, .order-page .color-card, .order-page .step,
body:has(.form-step) .choice, body:has(.form-step) .color-card, body:has(.form-step) .step {
  transition: background-color 240ms var(--motion-ease), border-color 240ms var(--motion-ease), color 240ms var(--motion-ease), box-shadow 240ms var(--motion-ease), transform 240ms var(--motion-ease);
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
  #narjis-scroll-progress { display: none; }
  .motion-enhanced .motion-reveal { opacity: 1 !important; transform: none !important; }
}
</style>
<style id="alnarjis-theme-styles">
:root{color-scheme:light;}

<script id="alnarjis-smooth-motion-script">

    progress.style.width = pct.toFixed(2) + '%';
  };

    if (!queued) { queued = true; window.requestAnimationFrame(updateProgress); }
  };

  window.addEventListener('resize', requestProgress, { passive: true });
  updateProgress();

  if (!reduced && 'IntersectionObserver' in window && document.body) {
    const selectors = [
      '.hero-content', '.about-brief', '.services-preview', '.service-card',
      '.page-header', '.detailed-service-card', '.about-section', '.contact-card',
      '.thank-you-card', '.intro', '.review-card', '.cost-card'

    const nodes = [...new Set(selectors.flatMap(sel => Array.from(document.querySelectorAll(sel))))];

        node.style.setProperty('--reveal-delay', (i % 4) * 55 + 'ms');
        observer.observe(node);
      });

    const link = event.target.closest && event.target.closest('a[href^="#"]');

    const id = link.getAttribute('href');
    if (!id || id === '#') return;
    let target;

      target.scrollIntoView({ behavior: 'smooth', block: 'start' });

<script id="alnarjis-theme-behavior">
(function(){

 var frame=0, endTimer=0;

   var dark=theme==='dark';
   if(toggle){toggle.setAttribute('aria-checked',dark?'true':'false');toggle.setAttribute('aria-label',dark?'التبديل إلى الوضع النهاري':'التبديل إلى الوضع الليلي');toggle.setAttribute('title',dark?'التبديل إلى الوضع النهاري':'التبديل إلى الوضع الليلي');}

 }
 window.__narjisApplyTheme=function(theme,animate){
   if(theme!=='dark'&&theme!=='light')return;
   requestedTheme=theme;
   try{localStorage.setItem('alnarjis-theme',theme);}catch(e){}
   if(frame){cancelAnimationFrame(frame);frame=0;}
   if(endTimer){clearTimeout(endTimer);endTimer=0;}

     endTimer=setTimeout(function(){root.classList.remove('theme-animating');endTimer=0;},470);
   });
   sync(theme);
 };
 if(toggle){toggle.addEventListener('click',function(){window.__narjisApplyTheme(requestedTheme==='dark'?'light':'dark',true);});}
 sync(requestedTheme);
})();
</script>
