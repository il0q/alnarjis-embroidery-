<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- السطر المسؤول عن تغيير أيقونة المتصفح لشعار النرجس -->
    <link rel="icon" type="image/png" href="lo.png">
    <title>تم إرسال طلبك بنجاح | النرجس للتطريز</title>
    
    <!-- استدعاء خط Cairo ليتناسب مع الهوية البصرية الجديدة للموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* الألوان والهوية البصرية الدافئة والمريحة للعين المتطابقة مع الهوية الجديدة */
        :root {
            --primary-color: #5c3d48; /* العنابي الملكي للمطرزات */
            --accent-color: #3DB7B5;  /* الذهبي الدافئ المريح */
            --bg-color: #FAF9F6;      /* درجة كريمية دافئة جداً وناعمة للعين */
            --card-bg: #f0eae1;       /* درجة دافئة للبطاقات بدلاً من الأبيض الصريح */
            --text-dark: #2d2d2d;     /* رمادي داكن ناعم للنصوص */
            --text-muted: #554d4f;    /* لون مريح للقراءة */
            --shadow: 0 15px 35px rgba(92, 61, 72, 0.06);
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        body {
            overflow-x: clip;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FAF9F6 0%, #B7EBE3 100%);
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 🧵 تأثير الخيوط الحية ثلاثية الأبعاد العائمة في الخلفية */
        .bg-threads-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transform-style: preserve-3d;
        }

        .thread-3d {
            position: absolute;
            width: 100%;
            max-width: 100%;
            height: 300px;
            fill: none;
            stroke-linecap: round;
        }

        .t-gold {
            top: 10%;
            left: 0;
            stroke: rgba(61, 183, 181, 0.24); 
            stroke-width: 2.5;
            animation: weave3D-Gold 25s infinite ease-in-out alternate;
        }

        .t-burgundy {
            bottom: 10%;
            right: 0;
            stroke: rgba(92, 61, 72, 0.22); 
            stroke-width: 2;
            animation: weave3D-Burgundy 30s infinite ease-in-out alternate;
        }

        /* بطاقة الشكر الفاخرة */
        .thank-you-card {
            background-color: var(--card-bg);
            padding: 50px 40px;
            border-radius: 35px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(184, 148, 36, 0.1);
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .thank-you-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(92, 61, 72, 0.1);
        }

        /* تنسيق شعار النرجس الدائري الحركي */
        .logo-img-thank {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--accent-color);
            transition: transform 0.8s var(--transition);
            box-shadow: 0 8px 20px rgba(92, 61, 72, 0.1);
        }

        .thank-you-card:hover .logo-img-thank {
            transform: rotate(360deg) scale(1.1);
        }

        h1 {
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 900;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* ⚡ فاصل ألوان متحرك وحي تحت العنوان */
        .divider {
            width: 120px;
            height: 4px;
            margin: 15px auto 25px auto;
            border-radius: 10px;
            background: linear-gradient(270deg, var(--primary-color), var(--accent-color), #3DB7B5, var(--primary-color));
            background-size: 600% 600%;
            animation: animateGradientStream 6s infinite linear;
        }

        p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.8;
        }

        /* ✨ زر العودة المطور بتأثير اللمعان والتوهج الذهبي المتطابق مع الموقع */
        .btn-back {
            background: linear-gradient(135deg, var(--accent-color) 0%, #2F8F8B 100%);
            color: white;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.4s var(--transition), box-shadow 0.4s var(--transition);
            display: inline-block;
            box-shadow: 0 10px 25px rgba(184, 148, 36, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* طبقة اللمعان المخفية للزر */
        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: none;
        }

        .btn-back:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 25px rgba(184, 148, 36, 0.8), 0 0 50px rgba(184, 148, 36, 0.4);
        }

        /* تفعيل تأثير وميض اللمعان عند التمرير */
        .btn-back:hover::before {
            animation: shineEffect 1.2s infinite ease-in-out;
        }

        /* 🎬 قوانين الحركات والتموجات واللمعان */
        @keyframes shineEffect {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes animateGradientStream {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes weave3D-Gold {
            0% { transform: translate3d(0, 0, -100px) rotateX(10deg) rotateY(5deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(20px, 30px, 50px) rotateX(-5deg) rotateY(15deg); }
            100% { transform: translate3d(-10px, -20px, -50px) rotateX(5deg) rotateY(-10deg); stroke-dashoffset: -300; }
        }

        @keyframes weave3D-Burgundy {
            0% { transform: translate3d(0, 0, -50px) rotateX(-10deg) rotateY(-10deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(-20px, -40px, 80px) rotateX(15deg) rotateY(5deg); }
            100% { transform: translate3d(15px, 20px, -120px) rotateX(-5deg) rotateY(10deg); stroke-dashoffset: 300; }
        }

        /* التوافق مع الهواتف الذكية */
        @media (max-width: 768px) {
            .thank-you-card {
                padding: 40px 25px;
                margin: 20px;
            }
            h1 {
                font-size: 26px;
            }
            p {
                font-size: 16px;
            }
            .bg-threads-3d {
                opacity: 0.2;
            }
        }
    </style>

<style id="thread-motion">
.thread-motion{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.38;}
.thread-motion span{position:absolute;width:42vw;height:2px;background:linear-gradient(90deg,transparent,rgba(61,183,181,.28),transparent);border-radius:999px;transform-origin:center;animation:threadDrift 14s ease-in-out infinite;}
.thread-motion span:nth-child(1){top:22%;left:-12%;transform:rotate(18deg);animation-delay:-2s;}
.thread-motion span:nth-child(2){top:48%;left:45%;width:35vw;transform:rotate(-24deg);animation-delay:-7s;}
.thread-motion span:nth-child(3){top:72%;left:-8%;width:48vw;transform:rotate(12deg);animation-delay:-10s;}
.thread-motion span:nth-child(4){top:34%;left:68%;width:30vw;transform:rotate(32deg);animation-delay:-5s;}
@keyframes threadDrift{0%,100%{translate:0 0;scale:1;opacity:.55;}50%{translate:18px -10px;scale:1.04;opacity:1;}}
@media (prefers-reduced-motion:reduce){.thread-motion span{animation:none;}}
@media (max-width:600px){.thread-motion{opacity:.22}.thread-motion span{width:70vw}.thread-motion span:nth-child(2){left:35%;width:55vw}.thread-motion span:nth-child(4){left:55%;width:45vw;}}
</style>
<style>

/* Alnarjis Plexus embroidery motion */
#alnarjis-plexus-canvas{
  position:fixed; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:0; opacity:.78;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(61,183,181,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,183,181,.035) 1px, transparent 1px),
    radial-gradient(circle at 50% 50%, rgba(183,235,227,.12) 0 1px, transparent 1.5px);
  background-size:42px 42px,42px 42px,84px 84px;
}
body > * { position:relative; z-index:1; }
#alnarjis-plexus-canvas { z-index:0; }
header, nav, .navbar, .hero, main, footer, section { position:relative; z-index:2; }

@media (prefers-reduced-motion: reduce){
  #alnarjis-plexus-canvas{display:none}
}

</style>
</head>
<body>
<canvas id="alnarjis-plexus-canvas" aria-hidden="true"></canvas>

    <!-- 🧵 الخلفية الحية الممتدة ثلاثية الأبعاد -->
    <div class="thread-motion" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="bg-threads-3d">
        <svg class="thread-3d t-gold" viewBox="0 0 1440 400">
            <path d="M0,200 C300,350 600,50 900,200 C1200,350 1300,100 1440,200" />
        </svg>
        <svg class="thread-3d t-burgundy" viewBox="0 0 1440 400">
            <path d="M1440,150 C1100,-50 800,350 500,150 C200,-50 100,250 0,150" />
        </svg>
    </div>

    <div class="thank-you-card">
        <!-- شعار النرجس الدائري المحدث -->
        <img src="lo.png" alt="شعار النرجس" class="logo-img-thank">
        
        <h1>تم إرسال طلبك بنجاح!</h1>
        <!-- الفاصل الملون الحي والمتحرك -->
        <div class="divider"></div>
        
        <p>شكراً لثقتك بالنرجس للتطريز، سيقوم فريقنا بمراجعة تفاصيل طلبك والتواصل معك عبر الواتساب في أقرب وقت ممكن. 🇴🇲</p>
        <a href="index.html" class="btn-back">العودة للرئيسية</a>
    </div>


<script>
(function(){
  const c=document.getElementById('alnarjis-plexus-canvas');
  if(!c || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=c.getContext('2d',{alpha:true});
  let W=0,H=0,dpr=1,nodes=[],mx=-9999,my=-9999,raf=0;
  const gold=[218,170,62], teal=[61,183,181], white=[245,245,238];

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=innerWidth; H=innerHeight;
    c.width=Math.floor(W*dpr); c.height=Math.floor(H*dpr);
    c.style.width=W+'px'; c.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count=W<700?18:Math.min(42,Math.max(28,Math.floor(W/34)));
    nodes=Array.from({length:count},(_,i)=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
      r:Math.random()*1.7+.7,
      phase:Math.random()*Math.PI*2,
      gold:i%3===0
    }));
  }

  addEventListener('resize',resize,{passive:true});
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
  addEventListener('pointerleave',()=>{mx=-9999;my=-9999},{passive:true});
  resize();

  function rgba(rgb,a){return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`}

  function frame(t){
    ctx.clearRect(0,0,W,H);
    const time=t*.001;
    const link=W<700?125:165;
    const react=W<700?0:190;

    for(const p of nodes){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
      if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20;
      p.yy=p.y+Math.sin(time*.45+p.phase)*2.5;
    }

    // subtle triangular / polygon wireframe
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const dx=a.x-b.x,dy=a.yy-b.yy,d=Math.hypot(dx,dy);
        if(d<link){
          const alpha=(1-d/link)*.15;
          const col=a.gold||b.gold?gold:teal;
          ctx.beginPath();ctx.moveTo(a.x,a.yy);ctx.lineTo(b.x,b.yy);
          ctx.strokeStyle=rgba(col,alpha);ctx.lineWidth=.65;ctx.stroke();

          const rx=Math.hypot(a.x-mx,a.yy-my);
          const ry=Math.hypot(b.x-mx,b.yy-my);
          if(rx<react || ry<react){
            const boost=Math.max(0,(1-Math.min(rx,ry)/react))*.28;
            ctx.beginPath();ctx.moveTo(a.x,a.yy);ctx.lineTo(b.x,b.yy);
            ctx.strokeStyle=rgba(white,boost);ctx.lineWidth=.9;ctx.stroke();
          }

          for(let k=j+1;k<nodes.length;k++){
            const q=nodes[k];
            const d1=Math.hypot(a.x-q.x,a.yy-q.yy);
            const d2=Math.hypot(b.x-q.x,b.yy-q.yy);
            if(d1<link*.82 && d2<link*.82){
              ctx.beginPath();
              ctx.moveTo(a.x,a.yy);ctx.lineTo(b.x,b.yy);ctx.lineTo(q.x,q.yy);ctx.closePath();
              ctx.fillStyle=rgba(teal,.018);ctx.fill();
              ctx.strokeStyle=rgba(gold,.045);ctx.lineWidth=.55;ctx.stroke();
            }
          }
        }
      }
    }

    for(const p of nodes){
      const d=Math.hypot(p.x-mx,p.yy-my);
      const glow=d<react?1+(1-d/react)*2:1;
      const col=p.gold?gold:teal;
      ctx.beginPath();ctx.arc(p.x,p.yy,p.r*glow,0,Math.PI*2);
      ctx.fillStyle=rgba(col,.78);ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.yy,p.r*3.8*glow,0,Math.PI*2);
      ctx.fillStyle=rgba(col,.055);ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
})();
</script>

</body>
</html>
