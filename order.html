<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلب الآن | النرجس للتطريز</title>
    <!-- استدعاء خط Cairo من جوجل ليتطابق مع باقي الموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* الألوان والهوية البصرية الدافئة والمريحة للعين المتطابقة مع index.html */
        :root {
            --primary-color: #5c3d48; /* العنابي الملكي للمطرزات */
            --accent-color: #b89424;  /* الذهبي الدافئ المريح */
            --bg-color: #f7f4ed;      /* درجة كريمية دافئة جداً وناعمة للعين */
            --card-bg: #f0eae1;       /* درجة دافئة للبطاقات والقوائم */
            --text-dark: #2d2d2d;     
            --text-muted: #554d4f;    
            --shadow: 0 15px 35px rgba(92, 61, 72, 0.04);
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* 🧵 الخلفية الحية ممتدة ثلاثية الأبعاد المتطابقة مع الرئيسية */
        .bg-threads-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transform-style: preserve-3d;
        }

        .thread-3d {
            position: absolute;
            width: 150%;
            height: 400px;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 15px 20px rgba(92, 61, 72, 0.15));
        }

        .t-gold {
            top: 5%;
            left: -25%;
            stroke: rgba(184, 148, 36, 0.35);
            stroke-width: 2.5;
            animation: weave3D-Gold 20s infinite ease-in-out alternate;
        }

        .t-burgundy {
            bottom: 5%;
            right: -25%;
            stroke: rgba(92, 61, 72, 0.3);
            stroke-width: 2;
            animation: weave3D-Burgundy 25s infinite ease-in-out alternate;
        }

        /* شريط التنقل العلوي */
        header {
            background-color: rgba(247, 244, 237, 0.95); 
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 25px rgba(92, 61, 72, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(184, 148, 36, 0.15);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            transition: transform 0.8s var(--transition);
        }

        .logo-wrapper:hover .logo-img {
            transform: rotate(360deg) scale(1.15);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-color);
        }

        nav a {
            color: var(--text-dark);
            text-decoration: none;
            margin-right: 25px;
            font-weight: 600;
            font-size: 16px;
            position: relative;
            transition: color 0.3s ease;
            padding: 8px 0;
            display: inline-block;
        }

        /* ⚡ خطوط ألوان حية ومتحركة تحت أزرار النافبار */
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(270deg, var(--accent-color), var(--primary-color), #ca5cdd, var(--accent-color));
            background-size: 400% 400%;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s var(--transition);
            animation: animateGradientStream 4s infinite linear;
        }

        nav a:hover::after, nav a.active::after {
            transform: scaleX(1);
        }

        nav a:hover, nav a.active {
            color: var(--primary-color);
        }

        /* 📄 عنوان الصفحة الرئيسي */
        .page-header {
            text-align: center;
            padding: 60px 20px 20px 20px;
            position: relative;
            z-index: 1;
        }

        .page-header h1 {
            font-size: 45px;
            color: var(--primary-color);
            font-weight: 900;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 19px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* فاصل ألوان متحرك وحي تحت العنوان الرئيسي */
        .header-divider {
            width: 180px;
            height: 5px;
            margin: 25px auto;
            border-radius: 10px;
            background: linear-gradient(270deg, var(--primary-color), var(--accent-color), #ca5cdd, var(--primary-color));
            background-size: 600% 600%;
            animation: animateGradientStream 6s infinite linear;
        }

        /* 🛠️ حاوية الاستمارة */
        .form-container {
            max-width: 700px;
            margin: 40px auto 100px auto;
            background-color: var(--card-bg);
            padding: 50px;
            border-radius: 35px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(184, 148, 36, 0.04);
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease;
        }

        .form-container:hover {
            transform: translateY(-5px);
        }

        /* تنسيق الحقول والمدخلات النظيفة */
        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 17px;
        }

        .form-group input[type="text"],
        .form-group input[type="tel"],
        .form-group input[type="file"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(92, 61, 72, 0.1);
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
            color: var(--text-dark);
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
        }

        .form-group input[type="file"] {
            padding: 12px;
            background-color: transparent;
            border: 2px dashed rgba(184, 148, 36, 0.2);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
            box-shadow: 0 0 15px rgba(184, 148, 36, 0.15);
        }

        /* خيارات الراديو */
        .radio-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* 🌟 زر إرسال الطلب المضيء واللامع التفاعلي المتطابق مع index.html */
        .btn-submit {
            background: linear-gradient(135deg, var(--accent-color) 0%, #a3811f 100%);
            color: #fff;
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(184, 148, 36, 0.3);
            transition: transform 0.4s var(--transition), box-shadow 0.4s var(--transition);
            position: relative;
            overflow: hidden;
            z-index: 1;
            font-family: inherit;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: none;
        }

        .btn-submit:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 25px rgba(184, 148, 36, 0.8), 0 0 50px rgba(184, 148, 36, 0.4);
        }

        .btn-submit:hover::before {
            animation: shineEffect 1.2s infinite ease-in-out;
        }

        /* تذييل الصفحة */
        footer {
            background-color: #1a1215;
            color: #b5a4ab;
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
            border-top: 3px solid var(--accent-color);
            position: relative;
            z-index: 1;
        }

        /* 🎬 قوانين الحركات ثلاثية الأبعاد واللمعان */
        @keyframes shineEffect {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes animateGradientStream {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes weave3D-Gold {
            0% { transform: translate3d(0, 0, -100px) rotateX(10deg) rotateY(5deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(40px, 30px, 50px) rotateX(-5deg) rotateY(15deg); }
            100% { transform: translate3d(-20px, -20px, -50px) rotateX(5deg) rotateY(-10deg); stroke-dashoffset: -300; }
        }

        @keyframes weave3D-Burgundy {
            0% { transform: translate3d(0, 0, -50px) rotateX(-10deg) rotateY(-10deg); stroke-dashoffset: 0; }
            50% { transform: translate3d(-50px, -40px, 80px) rotateX(15deg) rotateY(5deg); }
            100% { transform: translate3d(30px, 20px, -120px) rotateX(-5deg) rotateY(10deg); stroke-dashoffset: 300; }
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; padding: 15px; }
            nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
            nav a { margin: 0 5px; }
            .form-container { padding: 30px 20px; border-radius: 25px; }
            .page-header h1 { font-size: 32px; }
            .bg-threads-3d { opacity: 0.15; }
        }
    </style>

<script>
(() => {
  const canvas = document.getElementById("narjisParticleCanvas");
  if (!canvas) return;
  const host = canvas.parentElement;
  const ctx = canvas.getContext("2d", { alpha: true });
  if (!ctx) return;
  const particles = [];
  const pointer = { x: -9999, y: -9999, active: false, radius: 150 };
  let w = 0, h = 0, dpr = 1, raf = 0;
  const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const settings = { density: 9000, min: 24, max: 85, link: 125, speed: reduced ? 0.08 : 0.22 };

  function resize() {
    const r = host.getBoundingClientRect();
    w = Math.max(1, r.width); h = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(settings.min, Math.min(settings.max, Math.floor((w * h) / settings.density)));
    particles.length = 0;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = settings.speed * (0.35 + Math.random() * 0.65);
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: 0.75 + Math.random() * 1.3,
        phase: Math.random() * Math.PI * 2,
        pulse: 0.006 + Math.random() * 0.012
      });
    }
  }

  function pointerMove(e) {
    const r = host.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    pointer.active = inside;
    if (inside) {
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
    }
  }
  function pointerLeave() { pointer.active = false; pointer.x = pointer.y = -9999; }
  window.addEventListener("pointermove", pointerMove, { passive: true });
  window.addEventListener("blur", pointerLeave, { passive: true });
  window.addEventListener("resize", resize, { passive: true });

  function frame() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.phase += p.pulse;
      if (p.x < -8) p.x = w + 8; else if (p.x > w + 8) p.x = -8;
      if (p.y < -8) p.y = h + 8; else if (p.y > h + 8) p.y = -8;
      if (pointer.active) {
        const dx = p.x - pointer.x, dy = p.y - pointer.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < pointer.radius) {
          const force = (1 - d / pointer.radius) * 0.45;
          p.x += dx / d * force; p.y += dy / d * force;
        }
      }
    }
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < settings.link) {
          const alpha = (1 - d / settings.link) * 0.16;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(61,183,181,${alpha})`; ctx.lineWidth = 0.7; ctx.stroke();
        }
      }
    }
    for (const p of particles) {
      const pulse = 0.72 + Math.sin(p.phase) * 0.24;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(61,183,181,${0.04 * pulse})`; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(61,183,181,${0.72 * pulse})`; ctx.fill();
    }
    if (pointer.active) {
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(232,190,75,.65)"; ctx.fill();
      for (const p of particles) {
        const d = Math.hypot(p.x - pointer.x, p.y - pointer.y);
        if (d < pointer.radius) {
          const alpha = (1 - d / pointer.radius) * 0.24;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(pointer.x, pointer.y);
          ctx.strokeStyle = `rgba(232,190,75,${alpha})`; ctx.lineWidth = 0.75; ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(frame);
  }
  resize();
  cancelAnimationFrame(raf);
  frame();
})();
</script>
